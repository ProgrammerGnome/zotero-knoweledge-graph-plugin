<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Zotero AI Knowledge Map & Directory</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #121212; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #graph-container { flex: 1; position: relative; border-bottom: 2px solid #444; overflow: hidden; }
        #table-container { height: 35%; overflow-y: auto; background: #1e1e1e; padding: 10px; }
        canvas { display: block; cursor: grab; }
        canvas:active { cursor: grabbing; }

        #info-panel { 
            position: absolute; top: 10px; left: 10px; background: rgba(30, 30, 30, 0.9); 
            padding: 15px; border-radius: 8px; border: 1px solid #555;
            max-width: 300px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 100;
        }
        h2 { margin: 0; font-size: 16px; color: #4caf50; }
        .year { color: #ff9800; font-weight: bold; font-size: 13px; }

        table { width: 100%; border-collapse: collapse; color: #ddd; font-size: 13px; }
        th { text-align: left; background: #333; padding: 10px; position: sticky; top: 0; color: #4caf50; }
        td { padding: 8px 10px; border-bottom: 1px solid #333; vertical-align: top; }
        tr:hover { background: #252525; }
        
        .expand-icon { cursor: pointer; color: #4caf50; font-weight: bold; width: 20px; display: inline-block; transition: transform 0.2s; }
        .expanded .expand-icon { transform: rotate(90deg); }
        
        .details-row { display: none; background: #151515; }
        .details-container { padding: 10px 40px; border-left: 3px solid #4caf50; }
        .rel-box { margin-bottom: 5px; font-size: 12px; }
        .rel-label { color: #00e676; font-weight: bold; margin-right: 5px; }
        .rel-item { color: #1e88e5; text-decoration: underline; cursor: pointer; }
        
        .badge-local { background: #1e88e5; color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 10px; margin-right: 6px; font-weight: bold;}
        .badge-web { background: #f57c00; color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 10px; margin-right: 6px; font-weight: bold;}
    </style>
</head>
<body>

    <div id="graph-container">
        <div id="info-panel">
            <h2 id="panel-title">Knowledge Map</h2>
            <span id="panel-year" class="year">Select an article</span>
            <p id="panel-summary-text" style="font-size: 12px; line-height: 1.4;">Click on nodes to view details, drag to move them, or scroll to zoom.</p>
            <button id="delete-node-btn" style="display:none; margin-top:10px; width:100%; background:#d32f2f; color:white; border:none; padding:8px; border-radius:4px; cursor:pointer; font-weight:bold;">Delete from Database</button>
        </div>
        <canvas id="graphCanvas"></canvas>
    </div>

    <div id="table-container">
        <table id="articleTable">
            <thead>
                <tr>
                    <th></th>
                    <th>Year</th>
                    <th>Title</th>
                    <th>Summary</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    
    <script>
        window.onload = () => {
            const Zotero = window.opener.Zotero;
            const graphData = Zotero.AddonTemplate.data.graphData;
            if (!graphData || !graphData.nodes) return;

            const canvas = document.getElementById('graphCanvas');
            const ctx = canvas.getContext('2d');
            const nodes = graphData.nodes;
            const edges = graphData.edges;
            const radius = 22;

            let offsetX = 0, offsetY = 0, scale = 1;
            let isPanning = false, draggedNode = null, startX = 0, startY = 0, dragDist = 0;

            let selectedNode = null;
            const deleteBtn = document.getElementById('delete-node-btn');

            function resize() {
                const container = document.getElementById('graph-container');
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
            }
            window.onresize = () => { resize(); draw(); };
            resize();

            const centerX = canvas.width / 2, centerY = canvas.height / 2;
            nodes.forEach((n, i) => {
                const angle = (i / nodes.length) * Math.PI * 2;
                const dist = Math.min(canvas.width, canvas.height) * 0.3;
                n.x = centerX + dist * Math.cos(angle); n.y = centerY + dist * Math.sin(angle);
            });

            const tbody = document.getElementById('tableBody');
            nodes.forEach(node => {
                const tr = document.createElement('tr');
                const badge = node.origin === 'web' ? '<span class="badge-web">WEB</span>' : '<span class="badge-local">LOCAL</span>';
                
                tr.innerHTML = `
                    <td><span class="expand-icon">▶</span></td>
                    <td class="year">${node.year}</td>
                    <td style="font-weight:bold">${badge}${node.title}</td>
                    <td style="color:#bbb">${node.summary.substring(0, 100)}...</td>
                `;
                
                const detailTr = document.createElement('tr');
                detailTr.className = 'details-row';
                
                const outgoing = edges.filter(e => String(e.source) === String(node.id));
                const incoming = edges.filter(e => String(e.target) === String(node.id));

                const outHtml = outgoing.length > 0 ? outgoing.map(e => {
                    const targetNode = nodes.find(n => String(n.id) === String(e.target));
                    return `<div class="rel-box"><span class="rel-label">[${e.type}]</span> ➔ <span class="rel-item">${targetNode ? targetNode.title : 'Unknown'}</span></div>`;
                }).join('') : '<i>No outgoing references.</i>';

                const inHtml = incoming.length > 0 ? incoming.map(e => {
                    const sourceNode = nodes.find(n => String(n.id) === String(e.source));
                    return `<div class="rel-box"><span class="rel-label">[${e.type}]</span> ➔ <span class="rel-item">${sourceNode ? sourceNode.title : 'Unknown'}</span> references this</div>`;
                }).join('') : '<i>No incoming references.</i>';

                detailTr.innerHTML = `
                    <td colspan="4">
                        <div class="details-container">
                            <strong>Summary:</strong> <p>${node.summary}</p>
                            <div style="display:flex; gap: 40px;">
                                <div><strong>References:</strong>${outHtml}</div>
                                <div><strong>Referenced by:</strong>${inHtml}</div>
                            </div>
                        </div>
                    </td>
                `;

                tr.onclick = () => {
                    const isVisible = detailTr.style.display === 'table-row';
                    detailTr.style.display = isVisible ? 'none' : 'table-row';
                    tr.classList.toggle('expanded', !isVisible);
                    
                    document.getElementById('panel-title').innerText = node.title;
                    document.getElementById('panel-year').innerText = "Year: " + node.year;
                    document.getElementById('panel-summary-text').innerText = node.summary;
                };

                tbody.appendChild(tr);
                tbody.appendChild(detailTr);
            });

            canvas.addEventListener('mousedown', (e) => { 
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                const clickX = (mouseX - offsetX) / scale;
                const clickY = (mouseY - offsetY) / scale;
                
                draggedNode = nodes.find(n => Math.hypot(n.x - clickX, n.y - clickY) < radius);
                
                if (!draggedNode) {
                    isPanning = true;
                    startX = e.clientX - offsetX;
                    startY = e.clientY - offsetY;
                }
                dragDist = 0;
            });
            
            canvas.addEventListener('mousemove', (e) => { 
                if (draggedNode) {
                    const rect = canvas.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;
                    draggedNode.x = (mouseX - offsetX) / scale;
                    draggedNode.y = (mouseY - offsetY) / scale;
                    dragDist += Math.abs(e.movementX) + Math.abs(e.movementY);
                    draw();
                } else if (isPanning) { 
                    dragDist += Math.abs(e.movementX) + Math.abs(e.movementY); 
                    offsetX = e.clientX - startX; 
                    offsetY = e.clientY - startY; 
                    draw(); 
                } 
            });
            
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomSensitivity = 0.001;
                const delta = e.deltaY * -zoomSensitivity;
                const newScale = Math.min(Math.max(0.1, scale + delta), 5);
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                offsetX = mouseX - (mouseX - offsetX) * (newScale / scale);
                offsetY = mouseY - (mouseY - offsetY) * (newScale / scale);
                scale = newScale;
                draw();
            });

            canvas.addEventListener('mouseup', (e) => {
                if (dragDist < 5) {
                    const rect = canvas.getBoundingClientRect();
                    const clickX = (e.clientX - rect.left - offsetX) / scale;
                    const clickY = (e.clientY - rect.top - offsetY) / scale;
                    const node = nodes.find(n => Math.hypot(n.x - clickX, n.y - clickY) < radius + 10);
                    
                    if (node) {
                        document.getElementById('panel-title').innerText = node.title;
                        document.getElementById('panel-year').innerText = "Year: " + node.year;
                        document.getElementById('panel-summary-text').innerText = node.summary;
                        
                        selectedNode = node;
                        deleteBtn.style.display = 'block';
                    } else {
                        selectedNode = null;
                        deleteBtn.style.display = 'none';
                    }
                }

                draggedNode = null;
                isPanning = false;
            });
            
            canvas.addEventListener('mouseleave', () => {
                draggedNode = null;
                isPanning = false;
            });

            function drawCurvedArrow(ctx, start, end, label, curveOffset, nodeRadius) {
                const headlen = 10;
                const angle = Math.atan2(end.y - start.y, end.x - start.x);
                const midX = (start.x + end.x) / 2, midY = (start.y + end.y) / 2;
                const cpX = midX + curveOffset * Math.cos(angle + Math.PI / 2), cpY = midY + curveOffset * Math.sin(angle + Math.PI / 2);

                ctx.beginPath(); ctx.moveTo(start.x, start.y); ctx.quadraticCurveTo(cpX, cpY, end.x, end.y);
                ctx.strokeStyle = "#555"; ctx.lineWidth = 1.5; ctx.stroke();

                const arrowAngle = Math.atan2(end.y - cpY, end.x - cpX);
                const arrowPosX = end.x - nodeRadius * Math.cos(arrowAngle), arrowPosY = end.y - nodeRadius * Math.sin(arrowAngle);

                ctx.beginPath(); ctx.moveTo(arrowPosX, arrowPosY);
                ctx.lineTo(arrowPosX - headlen * Math.cos(arrowAngle - Math.PI/7), arrowPosY - headlen * Math.sin(arrowAngle - Math.PI/7));
                ctx.lineTo(arrowPosX - headlen * Math.cos(arrowAngle + Math.PI/7), arrowPosY - headlen * Math.sin(arrowAngle + Math.PI/7));
                ctx.closePath(); ctx.fillStyle = "#777"; ctx.fill();

                const textX = midX + (curveOffset * 0.6) * Math.cos(angle + Math.PI / 2), textY = midY + (curveOffset * 0.6) * Math.sin(angle + Math.PI / 2);
                ctx.font = "bold 9px Arial";
                const tw = ctx.measureText(label).width;
                ctx.fillStyle = "rgba(18,18,18,0.8)"; ctx.fillRect(textX - tw/2 - 2, textY - 6, tw + 4, 12);
                ctx.fillStyle = "#4caf50"; ctx.textAlign = "center"; ctx.fillText(label, textX, textY + 3);
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.save(); 
                ctx.translate(offsetX, offsetY);
                ctx.scale(scale, scale);

                const edgeGroups = {};
                edges.forEach(edge => {
                    const pairId = [edge.source, edge.target].sort().join('-');
                    if (!edgeGroups[pairId]) edgeGroups[pairId] = [];
                    edgeGroups[pairId].push(edge);
                });

                Object.values(edgeGroups).forEach(group => {
                    group.forEach((edge, index) => {
                        const s = nodes.find(n => String(n.id) === String(edge.source));
                        const t = nodes.find(n => String(n.id) === String(edge.target));
                        if (s && t) {
                            let curve = group.length > 1 ? (index - (group.length - 1) / 2) * 45 : 0;
                            if (String(s.id) > String(t.id)) {
                                curve = -curve;
                            }
                            //drawCurvedArrow(ctx, s, t, edge.type, curve, radius);
                            drawCurvedArrow(ctx, t, s, edge.type, curve, radius);
                        }
                    });
                });

                nodes.forEach(n => {
                    ctx.beginPath(); ctx.arc(n.x, n.y, radius, 0, Math.PI * 2);
                    ctx.fillStyle = n.origin === 'web' ? '#f57c00' : '#1e88e5'; 
                    ctx.fill();
                    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
                    ctx.fillStyle = "#fff"; ctx.font = "10px Arial"; ctx.textAlign = "center";
                    ctx.fillText(n.year, n.x, n.y + 3);
                    const lbl = n.title.length > 15 ? n.title.substring(0,12)+"..." : n.title;
                    ctx.fillText(lbl, n.x, n.y + radius + 12);
                });
                ctx.restore();
            }

            deleteBtn.onclick = async () => {
                if (!selectedNode) return;
                if (!confirm(`Biztosan törölni szeretnéd a(z) "${selectedNode.title}" cikket és az összes kapcsolódó élet az adatbázisból?`)) return;

                const success = await Zotero.AddonTemplate.deleteNodeById(selectedNode.id);
                
                if (success) {
                    const nIdx = nodes.indexOf(selectedNode);
                    if (nIdx > -1) nodes.splice(nIdx, 1);

                    for (let i = edges.length - 1; i >= 0; i--) {
                        if (String(edges[i].source) === String(selectedNode.id) || String(edges[i].target) === String(selectedNode.id)) {
                            edges.splice(i, 1);
                        }
                    }

                    selectedNode = null;
                    deleteBtn.style.display = 'none';
                    document.getElementById('panel-title').innerText = "Knowledge Map";
                    document.getElementById('panel-year').innerText = "Node deleted successfully.";
                    document.getElementById('panel-summary-text').innerText = "";

                    draw();

                    location.reload();
                } else {
                    alert("Hiba történt a törlés során a felhőben.");
                }
            };

            draw();
        };
    </script>
</body>
</html>
